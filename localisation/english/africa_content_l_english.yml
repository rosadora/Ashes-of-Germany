 #Back to Focuses / Ideas#

 LBA_finish_the_opposition:0 "Finish the Opposition"
 LBA_finish_the_opposition_desc:0 "Now that we have taken proper precautions, we can now finish the opposition to Mussolini's rule."
 morale_boost_ITA:0 "Mussolini Fled!"
 LBA_prepare_for_uprising:0 "Prepare for the Rebelion"
 LBA_prepare_for_uprising_desc:0 "In order to survive in a rebelion, we must develop the industry in the area of which we will uprise, otherwise known as the capital area."
 LBA_raise_militia:0 "Prepare Militias"
 LBA_raise_militia_desc:0 "In order for our uprising to suceed, we must prepare Militias to rise up alongside us. This will allow us to be able to survive in a longer conflict should it become one."
 LBA_civilwar_breakaway:0 "Breakaway Militia"
 LBA_overthrow_Mussolini:0 "Overthrow Mussolini"
 LBA_overthrow_Mussolini_desc:0 "The time has come to overthrow Mussolini and restore a new Monarchy to Africa."
 LBA_a_new_industry:0 "The First Libyan Industry"
 LBA_a_new_industry_desc:0 "Because we have fled Italy, the majority of our industry was left in Italy. Because of this, we must build a new industry to have any and all industrial capabilities."

 LBA_rally_around_the_crown:0 "Rally Around the Crown"
 LBA_rally_around_the_crown_desc:0 "Now that our monarchy has been restored, we can now rally around our crown to make future decisions for the good of our nation."
 LBA_industrial_research:0 "Industrial Research"
 LBA_industrial_research_desc:0 "Now that we are under our own crown, we can focus on Industrial Research to begin our fist industry."
 LBA_develop_the_deserts:0 "Develop our Cities"
 LBA_develop_the_deserts_desc:0 "Our cities, having been under Italian rule, have fallen into states of Disrepair and must be re-built from the ground up."
 LBA_celebrate_our_independance:0 "Festival of Independance"
 LBA_celebrate_our_independance_desc:0 "It only seems appropriate that we celebrate our independance going into a new age for our nation."
 LBA_develop_weapons:0 "Develop Defences"
 LBA_develop_weapons_desc:0 "In order to survive against our enemies, we must have weapons that are able to allow our survival in time of war."
 LBA_the_first_industry:0 "Develop our Factories"
 LBA_the_first_industry_desc:0 "We must ensure our industrial base, the base of any great nation, is able to sustain itself. Now that we do not have Italian Assistance we must learn to fend for ourself."
 LBA_develop_arms_industry:0 "Develop Arms Industries"
 LBA_develop_arms_industry_desc:0 "In order to create weapons of survival, we must have factories to sustain our survival against anyone that may attempt to end our independance."
 LBA_the_arsenal_of_independance:0 "Develop Gun Factories"
 LBA_the_arsenal_of_independance_desc:0 "In order to survive in the world of this day, we must create an arsenal of independance by making Factories for our Guns."

 LBA_prioritize_civilian_industries:0 "Prioritize Civilian Industries"
 LBA_prioritize_civilian_industries_desc:0 "In order to survive in the world of today, we must build a strong, independant industry reliant on no one."
 LBA_prioritize_military_industries:0 "Prioritize Military Industries"
 LBA_prioritize_military_industries_desc:0 "In order to survive in the world of today, we must ensure our military is armed and able to fight off any enemies we may have in the future."
 LBA_construct_steel_mills:0 "Construct Steel Mills"
 LBA_construct_steel_mills_desc:0 "In order to supply our industrial base, we must construct Steel Mills to maintain a steady supply of steel. This will allow us to fund our industry without having to trade with outside parties."
 LBA_construct_Tripoli_University:0 "Construct the Tripoli University"
 LBA_construct_Tripoli_University_desc:0 "Tripoli, the Capital of our nation, should have a high-tech university built to educate our citizens and allow more advanced research."
 LBA_troops_from_italy:0 "Italian Militias"
 LBA_troop_spawns:0 "Call Upon Libyan Militias"
 ETH_invade_Aussa:0 "Invade Aussa"
 national_building_projects_LBA:0 "National Building Projects"
 make_guns_more_effectively:0 "Efficient Gun Production"
 LBA_new_arms_factories:0 "Construct New Armament Factories"
 LBA_new_arms_factories_desc:0 "In order to defend our borders, we must ensure we are well armed and able to defend ourselves in the time of war."
 LBA_develop_fortifications:0 "Develop Border Fortifications"
 LBA_develop_fortifications_desc:0 "In order to defend our borders, we must construct fortifications to ensure any foreign force may think twice before invading our nation."
 LBA_make_guns_more_efficiently:0 "Produce More Effectively"
 LBA_make_guns_more_efficiently_desc:0 "In order for our nation to be well armed, we must produce the weapons of our survival more effectively to be able to arm every man who can defend their nation."
 LBA_develop_Trippoli_industries:0 "Develop Tripoli Industries"
 LBA_develop_Trippoli_industries_desc:0 "Tripoli, our largest city, must have its industry developed to turn it into a modern city of the world of tomorrow. This expansion will ensure our city is not forgotten to time."
 LBA_develop_eastern_cities:0 "Develop the Eastern Citites"
 LBA_develop_eastern_cities_desc:0 "In order for our nation to survive in the 1930's and 40's, we must ensure our cities are sufficiently developed for our industry to not only survive, but to thrive. Although electrified, the eastern expanses of our nation must be developed more than just via electrification, to do this we will not only build up our cities, but the quality of life in the cities."
 LBA_national_building_projects:0 "Start National Building Projects"
 LBA_national_building_projects_desc:0 "Now that our cities are developed, we must ensure that the rest of the nation is built up from the desert it sits on."
 LBA_restoration_of_the_monarchy:0 "Truly Restore the Monarchy"
 LBA_restoration_of_the_monarchy_desc:0 "Now that Mussolini has been overthrown, we can now officially crown our king and move forward as a truly independant nation."
 LBA_civilwar_milita_mon:0 "Call Upon Militias"
 LBA_form_royal_guards:0 "Form Royal Guards"
 LBA_form_royal_guards_desc:0 "In order to ensure our King's protection, we must form a royal guard to protect him. If the king is to be assasinated, it could cause a §RCivil War§R."
 LBA_constitutional_monarchy:0 "Form a Constitutional Monarchy"
 LBA_constitutional_monarchy_desc:0 "In order to survive in the world of today, we must adapt to the world of today. If we establish a Constitutional Monarchy, we might be able to seek protection from a large power in the world."
 LBA_absolute_monarchy:0 "Absolute Monarchy"
 LBA_true_monarchy:0 "Rally Around Idris Senussi"
 LBA_true_monarchy_desc:0 "In order to secure our complete survival, we must have an absolute ruler in control of the nation. Although this may seem as if we are turning towards the way of Mussolini, it is required for our survival. Idris Senussi is the person we should rally around for our continued survival as an independant nation."
 LBA_join_the_French:0 "Join the [FRA.GetAdjective]"
 LBA_join_the_French_desc:0 "In order for our survival as a constitutional monarchy, we must find allies who can defend our nation in the time of invasion. The [FRA.GetAdjective] are a good contender due to the fact they control most of North Africa which makes our territory vital to the defence of their own colonies. Alongside this, we may be able to request control over their colonies should we ever become strong enough to be considered a true ally."
 LBA_request_French_north_africa:0 "Request [FRA.GetAdjective] North Africa"
 LBA_request_French_north_africa_desc:0 "Now that we are allied with the French Nation, we could request control over their hold of North Africa. Although they are unlikely to accept, it is always worth a shot for such a large increase of territory"
 LBA_ally_the_kaiser:0 "Ally the Kaiser"
 LBA_ally_the_kaiser_desc:0 "The [PRS.GetAdjective]s, although further away from us from other powers, once were a major power in European politics, and can still grow to become one yet again. They can offer the militant protection we desperatley need against the neighboring major powers. "
 LBA_request_Prussian_guns:0 "Request [PRS.GetAdjective] Guns"
 LBA_request_Prussian_guns_desc:0 "The [PRS.GetAdjective] arms industry, although weakened, is still one of the Strongest military industries in europe, and as such they have guns. Although it is unlikely for them to give us weaponery, there is always still a chance they do"
 can_recruit_militias:0 "§RDoing this Focus will recruit  Militias during the civilwar!§R"
 Benito_Mussolini_Rebelious:0 "Benito Mussolini's Loyalists"
 Benito_Mussolini_Rebelious_desc:0 "Benito Mussolini's Loyalists have taken refuge in this state!"
 LBA_root_out_mussolinis_loyalists:0 "Root Out Mussolini's Loyalists"
 LBA_root_out_mussolinis_loyalists_desc:0 "Mussolini's Loyalists, having taken refuge in the east, must be rooted out to ensure our stability."
 destroy_mussolini_TT:0 "§Y Doing This Focus Unlocks Decisions to Remove Mussolini's Loyalists §Y"
 LBA_root_out_Mussolini_Loyalists:0 "Root Out Mussolini's Loyalists"
 LBA_root_out_loyalists1:0 "Root Out Loyalists in El Aghalei"
 LBA_root_out_loyalists2:0 "Root Out Loyalists in Sirte"
 LBA_root_out_loyalists3:0 "Root Out Loyalists in Bengsai"
 LBA_root_out_loyalists4:0 "Root Out Loyalists in Cyrenaica"
 LBA_root_out_loyalists5:0 "Root Out Loyalists in Derna"
 LBA_convincing_democrats:0 "Gaining Democratic Support"
 LBA_communist_support_rising:0 "Communist Support Rising"
 LBA_get_communist_support:0 "Seek Communist Support"
 LBA_get_communist_support_desc:0 "Although the Far Right, being radical across the world, are needed to support a new, truly democratic, constitution where everyone is repressented. "
 LBA_state_catholicism:0 "Support State Catholicism"
 LBA_state_catholicism_desc:0 "Although Catholicism is the most followed religion in the world, it is still somewhat foreign to the Libyan People. In order to immitate European democratic foundations, we should sponser the Shift towards Catholicism to try to become as successful as European democracies."
 LBA_drafting_the_constitution:0 "Drafting the Constitution"
 LBA_the_african_shield:0 "The African Shield"
 LBA_question_of_Idris_Senussi:0 "The Monarch Question"
 LBA_question_of_Idris_Senussi_desc:0 "Monarchs, the thing we have sworn to destroy. We once had our own, but, the question must arise, what shall we do with Idris Senussi?"
 African_Wildfire_:0 "Libyan Resistance Organization"
 LBA_draft_a_constitution:0 "Draft a Constitution"
 LBA_draft_a_constitution_desc:0 "Although we cannot enforce a Democracy as of right now, we can draft a constitution to be implemented whenever the people are eventually ready for the shift to democracy."
 LBA_convince_the_king_towards_democracy:0 "Convince the King Democracy is Right"
 LBA_convince_the_king_towards_democracy_desc:0 "In order to avoid a civil war, we must get support of Idris Senussi to ensure he does not attempt to stage an uprising against the democratic regime."
 LBA_boost_democratic_parties:0 "Convince the Parties"
 LBA_boost_democratic_parties_desc:0 "In order for our smooth shift to democracy, we must convince the other political parties to join our cause of a democratic reformation in Libya"
 LBA_get_european_support:0 "Seek European Democratic Support"
 LBA_get_european_support_desc:0 "Europe, being the birthplace of democracy, should be reached out to in order to ask for support in our Democratic endeavors. Should even one nation accept, it will strengthen our position in becoming democratic and reduce the chance of the King attempting to stop us." 
 LBA_enforce_constitutional_reform:0 "Enforce the Constitution"
 LBA_enforce_constitutional_reform_desc:0 "Now that we are almost complete writing our constitution and have received European support, we can now push for a Democratic 'Takeover'."
 LBA_women_rights:0 "Equalize the Women"
 LBA_women_rights_desc:0 "Although a relatively unseen policy, equalizing the Women to the Men will show we are a truly democratic nation, potentially moreso than the British or American nations."
 LBA_modernize_the_industries:0 "Modernize the Industries"
 LBA_modernize_the_industries_desc:0 "In order to keep up with Europe more than just in politics, we must Modernize our industrial capabilities to that of a European nation."
 LBA_communist_revolution:0 "Light the Sparks of Revolution"
 LBA_communist_revolution_desc:0 "The Democrats, believing we would join them, have only begun to increase our power in the government. Because of this, we are now in a position to stage a coup against the current government and Imprison Idris Senussi."
 LBA_follow_Russian_communism:0 "Follow Russian Communists"
 LBA_follow_Russian_communism_desc:0 "The Russian Communists, being the most recent major communist nation to take power in the world before us, pose to be a strong potential ally. If we are to ally with them, it will allow our position on the continent to be much stronger with such a powerful ally"
 LBA_African_Communism:0 "Prioritze African Communism"
 LBA_African_Communism_desc:0 "In order to prioritize our complete survival, we must create our own form of communism. We will not rely on any other nation to protect us, we will protect ourselves in the world of today."
 LBA_join_the_USR:0 "Join The [USR.GetAdjective]s "
 LBA_join_the_USR_desc:0 "The International, being lead by the Russian nation, the nation we have aligned with, should be joined to show the world we truly do with to cooperate with the [USR.GetFactionName]."
 LBA_spread_the_revolution:0 "Spread African Revolutionary Sentiment"
 LBA_spread_the_revolution_desc:0 "In order to secure our African Hegemony, we must ensure that the other African people share our ideals of Expelling the Colonizers."
 LBA_request_Soviet_Guns:0 "Request [USR.GetAdjective] Guns"
 LBA_request_Soviet_Guns_desc:0 "In order to Ensure our nations non-dependancy on the [USR.GetAdjective]s, we must create our own armed forces. To do this, we need guns that the [USR.GetAdjective]'s can provide."
 LBA_revolution_by_force:0 "Bring the Revolution by Force"
 LBA_revolution_by_force_desc:0 "In order to fully expel the colonizers, we must bring the African Revolution by force. There will be no excemption to our invasions for total African control."
 LBA_request_tunis:0 "Request Tunisia"
 LBA_request_tunis_desc:0 "Tunisia, being home to the Strategic city of Tunis, if in our hand, could greatly boost our Industrial Capabilities. Although it is owned by the French, if we request it and have close relations with the French Nation, they may give it up without any bloodshed."
 LBA_Consolidate_Idris_Senussis_Rule_IDEA:0 "Consolidating Idris Senussi's Rule"
 LBA_Consolidate_Idris_Senussis_Rule_IDEA_desc:0 "Consolidating Idris Senussi's Rule will ensure that there is no chance of an uprising against our current leadership. This will ensure our survival as an independant monarchy."
 LBA_consolodate_Idris_Senussis_Rule:0 "Consolidate Idris Senussi's Rule"
 LBA_consolodate_Idris_Senussis_Rule_desc:0 "In order to ensure our survival as an independant monarchy, we must rally around our current leadership without compromise. This will ensure there is no chance of an uprising to unfold against our current leadership."
 LBA_the_african_Prussia_idea:0 "The African Prussia"
 LBA_the_african_Prussia_idea_desc:0 "The Libyan nation has Proclaimed themselves as the African Prussia."
 LBA_the_african_Prussia_idea2:0 "The African Prussia"
 LBA_the_african_Prussia_idea2_desc:0 "The Libyan nation has Proclaimed themselves as the African Prussia."
 LBA_Berlin_Mission:0 "Mission to Berlin"
 LBA_Berlin_Mission_desc:0 "In order to ensure our survival as an independant African power, we must seek out allies who can protect us in the time of invasion. The [PRS.GetAdjective]s, although further away from us from other powers, once were a major power in European politics, and can still grow to become one yet again. They can offer the militant protection we desperatley need against the neighboring colonizers. "
 LBA_contact_the_British_Crown:0 "Mission to London"
 LBA_contact_the_British_Crown_desc:0 "The British, being the most powerful colonial power in the world, are a strong potential ally. Although our prefered alignment is with the Prussian State, we can still promote good relations with the British nation to attempt to ensure they will not pursue us for colonization. Alongside this, they may be able to offer us protection against the other neighboring colonial powers that the Prussians may not be able to protect us against. If we decide to truly ally with the British over the Prussians, this will be a strong step in that direction."
 LBA_execute_Italo_Balbo:0 "Execute Italo Balbo"
 LBA_execute_Italo_Balbo_desc:0 "Whenever we capitulated Mussolini's force, Italo Balbo, the former governor of Libya was captured. Although he is a strong political figure, his influence is not needed in our new nation and as such, it would be best for our survival to execute him to ensure there is no chance of him attempting to stage a Counter-Revolution against our new regime."
 LBA_rehabilitate_Italo_Balbo:0 "Rehabilitate Italo Balbo"
 LBA_rehabilitate_Italo_Balbo_desc:0 "Although Italo Balbo is a controversial figure, his experience and knowledge could be beneficial to our nation. Rehabilitating him would show our commitment to forgiveness and unity, while also potentially gaining his support for our cause."
 LBA_reconcile_the_Italians:0 "Reconcile with the Italians"
 LBA_reconcile_the_Italians_desc:0 "Although the Italians have been our oppressors and are the reason for our current situation, in order as a show of good will, we should attempt Reconciliation with the nation. Although it will probably fail, it is worth atlest attempting to show the world we are not out for revenge, but instead are out for freedom and unity."
 LBA_dreams_Of_Libyan_Empire:0 "Dreams of a Libyan Empire"
 LBA_dreams_Of_Libyan_Empire_desc:0 "Although we are a strong power for Africa, we are still a weak power in the world. Our ambitions, although larger, must be contained to a more realistic level. Instead of dreaming big about a united Africa, we should be realistic and dream of a new, Libyan Empire."
 LBA_invasion_of_Tunisia:0 "The Invasion of Tunisia"
 LBA_invasion_of_Tunisia_desc:0 "Tunisia, being a former Italian ambition, is not only a strategic position in the Meditteranean, but is home to the city of Tunis. If Libya can secure the Tunisian steel mills, it will fund our industry for years to come."
 LBA_invasion_of_Tunisia_2:0 "The Invasion of Tunisia"
 LBA_invasion_of_Tunisia_2_desc:0 "Tunisia, being a former Italian ambition, is not only a strategic position in the Meditteranean, but is home to the city of Tunis. If Libya can secure the Tunisian steel mills, it will fund our industry for years to come. Alongside this, it will show our worth to the Prussian nation"
 LBA_fra_surrender_TT:0 "§Y Following the fall of Tunis, France will have the chance to surrender within one month. §Y"
 LBA_proclaim_Libyan_empire:0 "Proclaim the Libyan Empire"
 LBA_proclaim_Libyan_empire_desc:0 "Now that we have secured Tunisia, we can now proclaim the Libyan Empire. This will show to the world that we are a major power in the region and will ensure our survival long term."
 Libya_civilwar_tt:0 "§Y Upon completing this focus, a civil war will begin between Idris Senussi and Benito Mussolini's forces! §Y"
 reconcile_NLC:0 "Reconciliation with the [NLC.GetName]"
 reconcile_ILF:0 "Reconciliation with the [ILF.GetName]"
 reconcile_ITA:0 "Reconciliation with the [ITA.GetName]"
 LBA_an_eternal_italian_enemy:0 "Eternal Italian Rivalry"
 LBA_an_eternal_Italian_enemy:0 "An Eternal Italian Rivalry"
 LBA_an_eternal_Italian_enemy_desc:0 "Although the Italians were once our overlords, the way they opressed our people has not been forgotten. We must never compromise with them via Reconciliation to ensure they never try to attempt an invasion of Libya again."
 LBA_ally_the_British_Crown:0 "Align with the United Kingdom"
 LBA_ally_the_British_Crown_desc:0 "The British, being the largest colonial power in the world, could offer Libya protection against other colonizers. Although many of our politicians wish to ally the Prussians, the British are able to protect us better than the Prussian nation can."
 focus_unlock_LBA_ITA:0 "§Y Completing this focus unlocks new focuses depending on who won the Italian Civilwar! §Y §R WORK IN PROGRESS FOR UNLOCKING FOCUSES §R"
 LBA_rejoin_Italy:0 "Rejoin the Italians"
 LBA_rejoin_Italy_desc:0 "Although our survival has been filled with ups and downs, the time for us to Re-Join the Italian nation is now. This will allow us to thrive now that we have developed our lands on our terms for some time now."
 LBA_Italo_Balbos_Coup:0 "Italo Balbo's Coup"
 LBA_Italo_Balbos_Coup_desc:0 "Although Idris Senussi has decided to Rehabilitate Italo Balbo, his ambitions have not been halted. Italo Balbo has begun the process of Staging a coup against the current Government of Idris Senussi. "
 distance_from_Italy:0 "Distance from Italy"
 visit_to_Rome:0 "Visit to Rome"
 LBA_alliance_with_Italy:0 "Alliance with Italy"
 LBA_alliance_with_Italy_desc:0 "In order to ensure there is not another counter-coup, we must ensure Italian support to defend our government agaisnt another coup from the Radical Idris Senussi."
 LBA_distance_from_italy:0 "Distance from Italy"
 LBA_distance_from_italy_desc:0 "Although Italian support would be nice, we mustn't risk them attempting to re-assert Control."
 LBA_rapprochment_with_Mussolini:0 "Rapprochment with Mussolini"
 LBA_rapprochment_with_Mussolini_desc:0 "Although Mussolini was overthrown from rule in Libya, now that a fascist coup has unfolded, we may be able to reconcile with him."
 LBA_libyanize_the_Policies:0 "Libyanize the Politics"
 LBA_libyanize_the_Policies_desc:0 "Although our recent roots are with Italy, we must embrace our older roots in Africa to ensure our longevity on the continent."
 LBA_adopt_Prussian_doctrine:0 "Adopt Prussian Doctrine"
 LBA_adopt_Prussian_doctrine_desc:0 "Although our proclomation of an 'African Prussia' has happened, we still must adapt our army for modern warfare. Although it has held its own before, our enemies were undersuplied and were not experienced in warfare, because of this, we must prepare to fight a true war so our nation's survival as an independant nation is assured."
 LBA_Erwin_Rommel:0 "Recruit Erwin Rommel"
 LBA_Erwin_Rommel_desc:0 "Although Rommel has active duty in Prussia, he has openly expressed interest in moving to a new theater in the world. Although he may not be a general per-se, his insight into how armies are meant to run make up for this."
 LBA_Prussian_Protectorate:0 "Seek Prussian Protection"
 LBA_Prussian_Protectorate_desc:0 "Although our alliance has already been fruitful, we must think of the next step for our survival. Although we will not be a fully independant nation, seeking Prussian protection will allow us to survive longer than not even if just as an autonomous zone."
 LBA_less_attrition:0 "Desert Conditioning"
 LBA_less_attrition_desc:0 ""
 LBA_Prussian_Logistics:0 "Prussian Desert Logistics"
 LBA_Prussian_Logistics_desc:0 "Although the Prussians are in eruope, they still have specialists for parts of the world. One of these parts of the world is Libya, because of this, we could recruit some of these specialists to condition our forces for the deserts of Africa."
 Libyan_francophobia:0 "Libyan Francophobia"
 Libyan_francophobia_desc:0 "Following after the Prussians, the Libyans have developed a form of Francophobia."
 LBA_prussian_Francophobia:0 "Adopt Prussian Francophobia"
 LBA_prussian_Francophobia_desc:0 "The Prussians, being Francophobes alongside those who we've aligned with politically, have strong influence over our people. Because of this influence, our population has been developing a form of Francophobia of their own. France being one of our neighbors who are a colonizer, may attempt to subdue us, but, with Prussian forces we can fight them and seize control of North Africa."
 LBA_submit_to_Britain:0 "Submit to Britain"
 LBA_submit_to_Britain_desc:0 "In order to protect ourselves against both the Italians and French, we must, although not prefered, submit to the British empire. Although this will undermine our influence temporarily, we will be able to re-gain it thru diplomatic maneuvering."
 LBA_maintain_our_independance:0 "Maintain Diplomatic Independance"
 LBA_maintain_our_independance_desc:0 "Although we have allied with the British Crown, in order to ensure our survival longer than just temporary, we must maintain diplomatic independance to a degree."
 maintain_our_independance:0 "Maintained Independance"
 LBA_asume_Egyptian_Control:0 "Request Egyptian Control"
 LBA_asume_Egyptian_Control_desc:0 "Although Egypt is an autonomous zone of the UK, we may be able to convince the British nation to give us control over it. If we manage to take control over the area, it will triple our power and allow us to maintain our independance longer than without Libya."
 Libyan_ENG_economic_Dependance:0 "Libyan - British economic dependance"
 Libyan_ENG_economic_support:0 "Libyan - British Company's"
 Libyan_ENG_economic_Dependance_desc:0 ""
 LBA_British_Economic_Dependance:0 "British Economic Dependance"
 LBA_British_Economic_Dependance_desc:0 "Although we want to maintain our independance, our economy is not yet developed enough to ensure this. Although tying ourselves to a single power economically is foolish, the British, having one of the biggest economies in the world, are a strong option to lean on for economic support."
 LBA_towards_a_Libyan_navy:0 "Towards a Libyan Navy"
 LBA_towards_a_Libyan_navy_desc:0 "In order to protect ourselves, we must protect all of our fronts, including the naval aspect of our fronts."
 #
 LBA_under_Mussolini_2:0 "Rally around Mussolini"
 LBA_under_Mussolini_2_desc:0 "Now that Mussolini has won the Libyan civilwar, we are now able to begin pursuing the goals of our Duce."
 rebuild_the_fascist_party_idea:0 "Rebuilding the Fascist Party"
 rebuild_the_fascist_party_idea_desc:0 "The fascist party is actively re-building in this nation"
 LBA_rebuild_the_Fascist_party:0 "Rebuild the Fascist Party"
 LBA_rebuild_the_Fascist_party_desc:0 "In order to secure our rule in Libya, we must begin a major effort to re-build the fascist party to ensure no more uprisings unfold."
 LBA_smuggle_Italo_Balbo:0 "Italo Balbo's Coup"
 LBA_smuggle_Italo_Balbo_desc:0 "Italo Balbo, having gained enough power politically, has mustered up the force for a peaceful coup de'tat of the nation. He is popular amongst the Libyan people, but is inexperienced leading a fully independant nation."
 LBA_recreate_the_grand_council:0 "Re-Convene a Grand Council of Fascism"
 LBA_recreate_the_grand_council_desc:0 "Although the council was in competition with Mussolini, it was a nessesary balance in Italian politics. Because of this, a choice has been made to re-convene a new, grand council of Fascism."
 LBA_rebuild_the_camicie_nere:0 "Rebuild the Camicie Nere"
 LBA_rebuild_the_camicie_nere_desc:0 "Although the Camicie Nere had more power than wanted in Italy, re-building them in Libya may prove to be a good idea for future military growth"
 LBA_assasinate_Italo_Balbo_2:0 "Imprison Italo Balbo"
 LBA_assasinate_Italo_Balbo_2_desc:0 "Although Italo Balbo was the former governor of Libya, his power has proven to be much stronger than wanted. Although there will be resistance to his Imprisonment, it is a mere neccessity at this point to ensure our nations survival."
 LBA_ensure_no_opposition:0 "Ensure No Opposition"
 LBA_ensure_no_opposition_desc:0 "Mussolini's control, already delicate, cannot have any risk of opposition to the rule."
 LBA_stay_with_Mussolini:0 "Remained with Mussolini"
 LBA_Opose_Mussolini:0 "Deposed Mussolini"
 reformed_grand_council_of_fascism:0 "Reformed Grand Council of Fascism"
 reformed_grand_council_of_fascism_desc:0 ""
 grand_council_formation_LBA:0 "Upon completing this focus, the Grand council of Fascism will be re-formed in Libya and will take power in the scenario of a coup against the current government."
 military_dictatorship_LBA:0 "Military Dictatorship"
 military_dictatorship_LBA_desc:0 "Following a failed coup by Italo Balbo, the Grand Council of Fascism has taken control of the Libyan nation."
 mussolini_triumphant_idea:0 "Mussolini Triumphant!"
 LBA_mussolini_triumphant:0 "Mussolini's Triumph"
 LBA_mussolini_triumphant_desc:0 "Now that Italo Balbo is dead, there is little to no opposition for Mussolini. Because of this, a triumph has been made, the first triumph of many in Libya."
 LBA_disband_the_council:0 "Disband the Grand Council of Fascism"
 LBA_disband_the_council_desc:0 "The grand council, only having been made as a precaution of Italo Balbo, has now outlived its purpose. In order to ensure our absolute rule, we must disband this opposition we have made against ourselves."
 LBA_empower_Camicie_Nere:0 "Empower the Camicie Nere"
 LBA_empower_Camicie_Nere_desc:0 "Although the Camicie Nere has been re-formed, it is still weaker than ever before. Because of this, we must empower the Camicie Nere as they were once under heavy influence of Italo Balbo"
 camicie_nere_LBA:0 "Camicie Nere"
 camicie_nere_LBA_desc:0 "Although the Camicie nere were an Italian Invention, they are still of use in Libya."
 LBA_reform_Italian_african_administrative_force:0 "Reform Italian Colonial Thought"
 LBA_reform_Italian_african_administrative_force_desc:0 "Although not formed, the Africa Orientale Italiana had been planned to be created after Ethiopia's defeat. Some of the elements of this plan remain in Libya, because of this, we can re-vitalize the original idea of what was planned."
 reformed_colonial_thought:0 "Reformed Colonial Thought"
 reformed_colonial_thought_desc:0 ""
 LBA_return_to_Italy:0 "Return to Italy"
 LBA_disband_the_Grand_council:0 "Disband the Grand Council of Fascism"
 raid_against_Italo_Balbo:0 "Rally against Italo Balbo"
 orchestrate_attack_in_Tripoli:0 "Orchestrate Attack in Tripoli"
 LBA_council_takeover:0 "The Council of Fascism has Taken Over"
 towards_a_meditteranean_bastion_idea:0 "Dreams of a United North Africa"
 LBA_ensure_no_counter_coup:0 "Ensure No Counter Coup"
 LBA_ensure_no_counter_coup_desc:0 "Although Mussolini is in jail, he cannot be trusted to not attempt a Counter Coup against the Libyan Nation. Because of this, we must ensure he does not have the chance to rally any support thru his death." 
 LBA_return_to_Italy:0 "Return to Italy"
 LBA_return_to_Italy_desc:0 "Now that we have mustered up a small army, the time has come to return to the Italian homeland."
 LBA_claim_Dalmatia:0 "Advance to Dalmatia"
 LBA_claim_Dalmatia_desc:0 "Dalmatia, one of the ambitions of Mare Nostrum, can now be taken following the Re-Capture of Rome."
 LBA_Tunisian_Question_1:0 "Request Tunisia"
 LBA_Tunisian_Question_1_desc:0 "Tunisia, Being one of the most wanted African territories in the world, is under the Weakened French flag, because of this, we may be able to demand it with success."
 LBA_push_to_the_Suez:0 "Push to the Suez"
 LBA_push_to_the_Suez_desc:0 "The Suez Canal, being one of the most Important canals in the world, must be taken to ensure our undisputed access to the Meditteranean sea."
 LBA_proclaim_Italian_empire:0 "Proclaim the Italian Empire Reborn!"
 LBA_proclaim_Italian_empire_desc:0 "Now that we have realized our ambitions, we can now proclaim the Italian Empire reborn."
 LBA_towards_a_meditteranean_bastion:0 "Push for a Unified North Africa"
 LBA_towards_a_meditteranean_bastion_desc:0 "Although we could invade into the Italian Peninsula, Libya's history is not in Europe, but is in Africa. Although we could not invade the much larger colonial powers around us, good relations may be able to allow us to request territory from them."
 LBA_request_french_north_africa_2:0 "Request French North Africa"
 LBA_request_french_north_africa_2_desc:0 "The French, controlling most of North Africa, are in a crumbling state compared to their past. The British blockade around them has proven to severely cut them off from supplies in North Africa, because of this, the French may be willing to part with their lands so the British are unable to take it."
 LBA_request_Egypt:0 "Request Egyptian Control"
 LBA_request_Egypt_desc:0 "Although Unlikely, the Egyptian state is an extremely strategic location not only in africa, but in the world. If we manage to take control of it, not only will we have one of the most important canals in the world, we will have acess to the Extensive Egyptian population."
 camicie_nere_LBA_2:0 "Integrated Camicie Nere"
 camicie_nere_integrated:0 "Upon completing this focus, the Camicie Nere will be integrated into the government of the Libyan state and will operate in the background."
 LBA_integrate_the_Camicie_Nere:0 "Integrate the Camicie Nere"
 LBA_integrate_the_Camicie_Nere_desc:0 "The Camicie Nere, being the force Italo Balbo was in when Libya was under the Italian thumb, have now proven their worth. Because of this, the time has come to integrate them into the army in it's entirety."
 LBA_secure_council_control:0 "Secure Council Control"
 LBA_secure_council_control_desc:0 "The decision to remain in control will cause some controversy, because of this, we must secure our control before a rebelion unfolds."
 LBA_seek_external_support_council:0 "Seek External Support"
 LBA_seek_external_support_council_desc:0 "Although our grip of the country is able to hold, it will be wise to see support of outside nations in order to ensure no uprisings unfold under our control."
 LBA_consolodate_the_capital:0 "Fortify the Capital"
 LBA_consolodate_the_capital_desc:0 "Tripoli, our capital, where the council is held, is currently unfortified. Because of this, any foreign power could merely walk into our capital without resistance. To solve this, we must build fortifications not only thru out the city, but also in the Senate building."
 LBA_execute_Italo_Balbo2:0 "Execute Italo Balbo"
 LBA_execute_Italo_Balbo2_desc:0 "Italo Balbo, having had lead the coup against the Mussolini, is now in a position to be put down."
 LBA_council_vote:0 "Council Vote"
 LBA_council_vote_desc:0 "Now that the council is in complete control over the nation, we must hold a vote on our future leadership."
 LBA_another_vote:0 "Hold Another Vote"
 LBA_council_vote_desc:0 "Now that the council has outlived its purpose, we must now hold another vote for the future of our nation."
 breach_italian_ties:0 "Break Italian Ties"
 LBA_breach_Italian_Ties:0 "Break All Italian Ties"
 LBA_breach_Italian_Ties_desc:0 "In order to ensure we are not looked down on by the italians as just another remnant of fascism, we must breach our current ties with the Italian Nations. Although it may be overkill, it is a neccessity to ensure they know we will not just bow under them if they ever attempt to re-invade our nation."
 LBA_construct_the_Via_Balbia:0 "Construct the Strada Litoranea Libica"
 LBA_construct_the_Via_Balbia_desc:0 "The Strada Litoranea Libica, already under construction under Benito Mussolini, is now in a position where it can be completed. Upon us completing the railroad, it will allow us to start shipping international goods into the country without the need of naval resources."
 LBA_construct_the_Via_Balbia_2:0 "Construct the Strada Litoranea Libica"
 LBA_construct_the_Via_Balbia_2_desc:0 "The Strada Litoranea Libica, already under construction when we fled from the Italian Nation, once completed will not only encourage trade with the Libyan Nation, it will open many new opportunities for realizing the Italian Dream of ruling the Meditteranean."
 Via_Balbia_Construction:0 "Strada Litoranea Libica Constructed"
 LBA_never_again_a_shore:0 "Never Again a Shore"
 LBA_never_again_a_shore_desc:0 "Although the dreams of a 'Fourth Shore' were popular amongst the people, now that Mussolini is no longer the leader of Italy, there is no point in pursuing to align with a force that we cannot trust. Because of this, our dreams must end and we must ensure our independance on a long-term scale."
 LBA_never_again_a_shore_idea:0 "Never Again a Shore"
 LBA_air_force_balbo_1:0 "A Libyan Air Force"
 LBA_air_force_balbo_2:0 "A Prioritized Libyan Air Force"
 LBA_naval_focus:0 "A Prioritized Libyan Navy"
 LBA_a_libyan_airforce:0 "Prioritize the Air Force"
 LBA_a_libyan_airforce_desc:0 "Now that we have re-formed our administration, we can now focus on the creation of a true libyan air force. Although we have already put effort into an air force, it is no where near enough to say we are a nation with an air force worth fighting. "
 LBA_develop_desert_logistics:0 "Develop Desert Logistics"
 LBA_develop_desert_logistics_desc:0 "Although our nation is in africa, our current fighting army is much more akin to that of fighting in Europe. Because of this, we must develop our desert logistical capabilities to ensure we can hold out against any outside threat to our sovereignty."
 LBA_desert_development:0 "Develop the Interior"
 LBA_desert_development_desc:0 "Now that the Strada Litoranea Libica is constructed, we can now focus on developing the interior of Libya. By developing our interior, it will allow us begin pushing urbanization away from the coasts."
 LBA_modernize_the_Castel_Benito:0 "Modernize the Castel Benito"
 LBA_modernize_the_Castel_Benito_desc:0 "The Castel Bentio, being the largest airfield in Libya, must be modernized to compete with our new enemies. Alongside this, we must de-mussolinify the Libyan nation regardless, this can be done by re-naming the Air Field to the Castel Balbo."
 LBA_modernize_aircraft:0 "Modernize The Air Force"
 LBA_modernize_aircraft_desc:0 "Italo Balbo, being an active air marshal, has requested the modernization of the air force. Although we are not in a position to focus on modernizing an air force, we will need one if the Italian Nation attempt to re-invade the Libyan Nation."
 LBA_focus_on_air_logistics:0 "Develop Air Logistics"
 LBA_focus_on_air_logistics_desc:0 "Although not as superior as other air forces, the Libyan air force can reach all corners of Libya. Because of this, if we build our supply lines off of our air force, we will be able to supply almost all of Libya without having to create ports for ships."
 LBA_request_Tunisa:0 "Push For Tunisia"
 LBA_request_Tunisa_desc:0 "Tunisia, although being lead by the French, is home of the strategic city of Tunis. If we manage to take control over Tunisia, we will have control over a strategic, defendable area in the scenario if Italy attempts to re-invade our nation."
 LBA_invade_Sicily:0 "Secure Sicily"
 LBA_invade_Sicily_desc:0 "Sicily, being on the other side of the Meditteranean from our coast, if we manage to take control over, we will be able to secure the Central Meditteranean."
 LBA_finish_electrification_in_Tripoli_FASCISM:0 "Finish Electrification in Tripoli"
 LBA_finish_electrification_in_Tripoli_FASCISM_desc:0 "Although Tripoli is our most developed city, it was in the middle of electrifying whenever the Italian State collapsed. Because of this, we must finish our efforts to electrify Tripoli to ensure our capital is up to par with the rest of not only africa, but the world."
 LBA_national_logistic_programs:0 "Develop National Logistics"
 LBA_national_logistic_programs_desc:0 "In order to ensure we are able to feed our armies, we must develop our supply nodes and farms to ensure not one soldier starves. "
 LBA_modernize_eastern_airfields:0 "Modernize the Eastern Airfields"
 LBA_modernize_eastern_airfields_desc:0 "The Eastern Libyan Airfields, although not as large as the Castel Bablo, are still important air fields to the security of our nation. Because of this, we must ensure they are up to date and able to accomodate our aircraft."
 LBA_re-organize_the_army:0 "Re-Organize the Army"
 LBA_re-organize_the_army_desc:0 "Although our army is in a fighting stance, it must be re-organized into an army that dosent fully resemble the Italian Army."
 LBA_a_Libyan_navy:0 "Towards A Libyan Navy"
 LBA_a_Libyan_navy_desc:0 "Now that Tripoli is fully electrified, we can now focus on developing a new naval foothold in the Meditteranean off of our coasts. The Regia Marina from the Italian Nation already give us naval dominance along our coasts, however, if we are to last as a nation, we must ensure our security across the Meditteranean Sea."
 LBA_electrify_the_east: "Electrify the East"
 LBA_electrify_the_east_desc:0 "Although our capital is now electrified, there are 2 major cities in the east that still are without electrification. In order to say we are moving into the future, we must electrify these cities to ensure they do not fall behind the rest of Libya."
 LBA_electrify_the_east_MON:0 "Electrify the East"
 LBA_electrify_the_east_MON_desc:0 "Our eastern cities, being home to around 120 thousand people, must be electrified to show that we are not just another african nation where all the wealth is in our quite vulnerable capital."
 LBA_electrify_the_deserts:0 "Electrify the Deserts"
 LBA_electrify_the_deserts_desc:0 "Although our priority lies in our cities, our deserts still are home to many people and must be developed. Although our resources can be devoted elsewhere, it is a neccesary step to move forward in our national survival."
 LBA_electrify_the_deserts2:0 "Electrify the Deserts"
 LBA_electrify_the_deserts2_desc:0 "Although our priority lies in our cities, our deserts still are home to many people and must be developed. Although our resources can be devoted elsewhere, it is a neccesary step to move forward in not only our national survival but the survival of the fascist ideology"
 LBA_request_Malta:0 "Request Maltan Ownership"
 LBA_request_Malta_desc:0 "Malta, being one of the largest naval bases in the world, if in our control will allow us to secure the Central Meditteranean from outside forces."
 LBA_focus_on_navy:0 "Prioritize The Navy"
 LBA_focus_on_navy_desc:0 "Now that we have taken control over Malta, we are now in a position to prioritize the creation of a true Libyan Navy. Although we took the Italian Navy with us when we had left the peninsula, it has long since become outdated and because of this, our navy is currently unfit to be in real combat."
 LBA_focus_on_airforce:0 "Prioritize The Air Force"
 LBA_focus_on_airforce_desc:0 "Italo Balbo, being a staple member of the air force in Italy, has already begun to create an air force program. Because of this, if we prioritze the creation of an air force, we will not only appease Italo Balbo, but we will also be able to fight the European Armies by beating them in the air."
 LBA_master_of_shores:0 "Proclaim the Master of the Shores"
 LBA_master_of_shores_desc:0 "Although we have cut our ties with Italy and have never wanted to become a shore, we can become the master of the shores. The thought of the 'Fourth Shore' has never faded from the mind of Italo Balbo, although that was his initial ambition, the Master of the Shores will do in this place."
 LBA_master_of_the_lands:0 "Master of the Land"
 LBA_the_master_of_the_land:0 "Master of the Army"
 LBA_the_master_of_the_land_desc:0 "Although we have already prioritized one of our main branches, there is no point in that branch being strong whenever our army itself cannot fight. In order not to rely on the already strengthened branch of the military, we must build our army and ensure it can hold its own in combat. If we fail to do this, we will just be another Invaded African State."
 LBA_Bengsai_research:0 "Construct the Tripoli University"
 LBA_Bengsai_research_desc:0 "Tripoli, being the largest city in the nation, now having been electrified, is now in a position to have a new national university constructed in the heart of the city. Alongside this, its coastal location will allow for naval research to be conducted alongside other research projects."
 LBA_rally_blackshirts:0 "Italian Blackshirts"
 LBA_rally_the_Blackshirts:0 "Rally the Blackshirts"
 LBA_rally_the_Blackshirts_desc:0 "The Blackshirts, having been an integral supporter of Mussolini, have also had a majority of its members flee to Libya with Mussolini. Because of this, rallying them will allow us to use them against those who may wish to put us down once and for all"
 LBA_quality_over_quantity:0 "Quality over Quantity"
 LBA_quality_over_quantity_desc:0 "Although we can always get men, we cannot always get better technology. Because of this, focusing on Quality over Quantity for now will benefit us more in the long term."
 LBA_quantity_over_quality:0 "Quantity over Quality"
 LBA_quantity_over_quality_desc:0 "Although our army's quality will eventually become outdated, for now we must create a large, strong army to repel anyone who may try to take advantage of our weak state. If the Italo-Libyan state is to fall to ourside forces, not only would it be then end of the Italian Fascist Party, it would be the end of Fascism as a whole across the world."
 LBA_disband_the_blackshirts:0 "Disband the Blackshirts"
 LBA_disband_the_blackshirts_desc:0 "The Blackshirts, having operated in our nation for some time, has slowly been causing our nations internal collapse. Because of this, although they are a vital part to our armed forces strength, they must be put down. This is not a matter of who likes who, this is a matter of survival as a whole state."
 LBA_invite_the_IRI:0 "Invite the IRI"
 LBA_invite_the_IRI_desc:0 "The IRI, otherwise known as the Istituto per la Ricostruzione Industriale in Italy, was founded under Benito Mussolini to help the Italian Economy. Now that we are in Libya, an area with prime real estate and investment opportunities, the IRI may now be inclined in working with Benito Mussolini yet again."
 LBA_empower_the_IRI:0 "Strenghten the IRI"
 LBA_empower_the_IRI_desc:0 "The IRI, having helped our economic situation, has earned the reward of being strengthened in the nation of Libya. By strengthening them, they will be able to not only have more power over our nation, they will also be in our debt"
 LBA_electrification_of_Tripoli:0 "Electrify Tripoli"
 LBA_electrification_of_Tripoli_desc:0 "Although this concern is beneath us, we must still appease the Duce by electrifying the capital region of the Italo-Libyan state."
 not_intended_path:0 "§Y This is NOT the intended path to play with Italo Balbo as your country leader! §Y"
 LBA_electrification_of_Tripoli_MON:0 "Electrification of Tripoli"
 LBA_electrification_of_Tripoli_MON_desc:0 "Tripoli, being the heart of the Libyan Nation, must be electrified in order to show the world that we are not just another backwarded african nation."
 LBA_electrify_the_east_Mus:0 "Electrify the East"
 LBA_electrify_the_east_Mus_desc:0 "In order to maintain our people do not try to rebel again, we must tend to their ungrateful needs of electrification."
 LBA_callout_to_the_world:0 "Callout to the World"
 LBA_callout_to_the_world_desc:0 "Although we were the largest fascist nation in Europe, there are still other fascists across the world. Now that we have been forced to flee, we must call out to the other Fascist nations in the world for support, even though it will be seen as a sign of weakness."
 LBA_evaluate_libyan_workforce:0 "Evaluate the Libyan Workforce"
 LBA_evaluate_libyan_workforce_desc:0 "The Libyan workforce, being new to modernization, must be evaluated to see where they fit in the country. By doing this, we can find out what our men are good at and what they aren't skilled at."
 LBA_develop_tripoli_industries:0 "Develop Tripoli Industries"
 LBA_develop_tripoli_industries_desc:0 "Now that we know what our men are capable of, we are now able to put them into new factories that are fitted to their specialties."
 LBA_use_Prussian_contacts:0 "Request Prussian Weaponery"
 LBA_use_Prussian_contacts_desc:0 "The Prussians, having had our help re-form the government after the great war, have many sympathizers in their government. Because of this, some of our limited advisors have suggested we reach out to them and request weapons, however, there is a chance of their denial which could squander all potential diplomatic opportunities of this sort in the future. However, us now being allied with the Prussian State openly has allowed us to secure the sympathy of some Prussian citizens which could add to the pressure to support our country."
 visit_to_Berlin:0 "Diplomatic Mission to Berlin"
 LBA_Mission_to_Berlin:0 "Mission to Berlin"
 LBA_Mission_to_Berlin_desc:0 "In order to pursue diplomacy with the Prussian state, we must first have a diplomatic mission to Berlin, the nation's capital, and meet with the Prussian Kaiser."
 LBA_Use_british_contacts:0 "Pursue British Ties"
 LBA_Use_british_contacts_desc:0 "The British, having historically been our ally during the Great war, although a democratic state, could be a good ally for the Italo-Libyan state. Although they are not preferable for the survival of Fascism, we must adapt if we are to survive in Libya."
 LBA_join_the_Prussians:0 "Request an Official Alliance with Prussia"
 LBA_join_the_Prussians:0 "The Prussian Kaiser, now having had met with Mussolini in a successful meeting, may now be swayed to allowing the Libyan nation into the Prussian Faction. If we suceed, we will manage to have become allies with one of the strongest nations on the European continent."
 LBA_join_the_British:0 "Request an Official Alliance with Britain"
 LBA_join_the_British_desc:0 "Following our trip to London, our diplomats have managed to get into contact with the British government and have managed to secure a smooth process should we join the Allies. All that remains to officially join the British is to officially send the request of alliance."
 LBA_British_economic_support:0 "Invite British Company's"
 LBA_British_economic_support_desc:0 "Although the majority of British company's are already global industrial giants, some of the smaller companies, which are still trying to get their bearings, may be invited into Libya. If they come to Libya, we can claim them to be in our debt and push their factories for Governmental work."
 LBA_Mussolini_Manpower:0 "Upon completing this focus, every country that supported us in the Callout to the World focus will have a call of their men to fight for the great Italo-Libyan state"
 LBA_exploit_foreign_sympathizers:0 "Exploit Foreign sympathizers"
 LBA_exploit_foreign_sympathizers_desc:0 "Following our callout to the world, the nations that have accepted our callout have had slow, but effective propoganda in their major cities. We are now in a position to exploit those who are in a position to fight for our cause."
 LBA_develop_Tripoli_university:0 "Develop the Tripoli University"
 LBA_develop_Tripoli_university_desc:0 "The Tripoli University, being in our capital, must be developed to catch up with the rest of the Italo-Libyan state. "

  #EVENTS#
 
  LBA_news_28.desc:0 "After being ousted from power in Italy, Benito Mussolini fled to Libya and was recently placed under house arrest for criminal incompetence and treason by inaction in Italy, awaiting his fate - which finally caught up with him. Early this morning, the former leader of Italy and Libya faced a firing squad in front of a small group of representatives from the Italian and Libyan government and was buried the same day in a private ceremony in Italy attended by his closest family."



 
