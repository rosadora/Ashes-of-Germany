 #ETHIOPIA CONTENT#
 ETH_hold_out_idea:0 "Hold out against Italy"
 Victory_over_ITA_ETH:0 "Victory in the Second Italo-Ethiopian war"
 ETH_global_italian_refugees:0 "Global Italian Refugees"
 ETH_hold_out:0 "Hold Out"
 ETH_hold_out_desc:0 "Italy is already on the brink of collapse, we just need to hold out long enough to exploit it."
 ETH_push_them_back:0 "Push Back the Italians"
 ETH_push_them_back_desc:0 "If we push back the Italians and re-take our lands, we will have a better chance of holding out until the innevitable Italian collapse"
 ETH_accept_global_italian_refugees:0 "Accept Italian Refugees"
 ETH_accept_global_italian_refugees_desc:0 "In order for us to show to the world we are the right people to win this war, we must be the bigger country and accept Italian refugees from abroad."
 ETH_the_arsenal_of_independance:0 "Develop a New Arsenal"
 ETH_the_arsenal_of_independance_desc:0 "In order to survive after the Italian invasion, we must create a new arsenal to ensure our army is prepared for any future wars against our neighbors."
 ETH_develop_cheap_guns:0 "Develop Cheap Guns"
 ETH_develop_cheap_guns_desc:0 "Ethiopia isn't exactly a resource-filled nation, due to this, we must research how to make our gun production cheaper to ensure we are able to produce the same amount of weapons as our colonial neighbors should they attempt invasion."
 ETH_Victory_against_Italy:0 "Victory against Italy"
 ETH_Victory_against_Italy_desc:0 "Against all odds, we have managed to hold out against the Italian onslaught, we can now focus on other politics now that we are out of our existential crisis."
 ETH_rally_the_people:0 "Rally the People"
 ETH_rally_the_people_desc:0 "Italy, already being on the brink of collapse, is now in a position where all we must do is Hold out. To better ourselves, we can rally our people to secure our front long enough to hold out against the collapsing menace."
 ETH_anarchist_commune_idea:0 "Anarchist Council"
 ETH_anarchist_commune_idea_desc:0 "Ethiopia, being under a semi-anarchist council, has begun to internally collapse."

