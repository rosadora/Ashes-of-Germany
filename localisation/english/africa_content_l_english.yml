 #ETHIOPIA IDEOLOGY#
 ethiopian_commune:0 "Ethiopian Commune"
 ethiopian_commune_desc:0 "This is a commune created by the Ethiopian People, it is inspired by both communist ideals and ideas of the people. Because of this, the nation's stability has begun taking a hit because of the way the commune is structured among individual power instead of a centralized authority."