 LBA_neutrality_party:0 "House of Senussi"
 LBA_neutrality_party_long:0 "The House of Senussi"
 AML_neutrality_party:0 "House of Senussi"
 AML_neutrality_party_long:0 "The House of Senussi"
 LBA_under_Mussolini:0 "Under Mussolini"
 LBA_under_Mussolini_desc:0 "Mussolini, the leader of the Italian Nation, has fled to our territory to escape the punishment of the civilwar. He has demanded we embrace him by re-naming our nation and our ethnicity. We hope he can one day return so we may be rid of him."
 LBA_embrace_African_roots:0 "Embrace African Roots"
 LBA_embrace_African_roots_desc:0 "Although we are from Italy, we must take advantage of the opportunity at hand of a new, unrelated nation in a new theater. §RWill load the Genric Focus Tree§R"
 oppose_mussolini_LBA_idea:0 "Opposition to Mussolini"
 oppose_mussolini_LBA_idea_desc:0 ""
 LBA_embrace_Mussolini:0 "Cement Our Rule"
 LBA_embrace_Mussolini_desc:0 "The Libyan Inhabitants, although strong, will oppose the word of Mussolini and must be put down. This will ensure Mussolini's Permanent rule."
 LBA_oppose_Mussolini:0 "Oppose Mussolini"
 LBA_oppose_Mussolini_desc:0 "Mussolini, the tyrant from the north, must be deposed in order for Libyan survival long term. We mustn't permit this mad man to burn our country into the ground!"
 LBA_starve_the_people:0 "Starve the People"
 LBA_starve_the_people_desc:0 "Starving the People will permit us to have a stronger grip over our population allowing us to maintain control."
 starve_the_people:0 "Starving the People"
 LBA_denounce_Idris_Senussi:0 "Denounce Idris Senussi"
 LBA_denounce_Idris_Senussi_desc:0 "Idris Senussi, the main Anti-Italian political leader, although cannot be killed without risk of war, can certainly be denounced."
 LBA_constitutional_monarchy_idea:0 "Forming a Constitutional Monarchy"
 LBA_constitutional_monarchy_idea_desc:0 "The Libyan Nation is actively encouraging a constitutional monarchy."
 LBA_PRS_ally_focus:0 "Diplomatic Mission to Berlin"
 visit_to_london:0 "Diplomatic Mission to London"
 LBA_the_african_Prussia:0 "The African Prussia"
 LBA_the_african_Prussia_desc:0 "Now that we have aligned with the Prussian Nation, we can now proclaim the 'African Prussia'."

